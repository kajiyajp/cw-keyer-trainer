# 作成：2026-11-22
# 目的：練習アプリ（app/）を GitHub Pages に公開する。テストが通ったときだけ公開し、test/ と package.json は出さない
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: テスト
        working-directory: app
        run: npm test
      - name: 公開するファイルを _site/ に集める
        run: |
          mkdir _site
          cp -r app/. _site/
          rm -rf _site/test _site/package.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
