; 作成：2026-11-21
; 目的：XIAO RP2040 実機ビルドと、PC 上のロジックテスト（native）を定義する

[platformio]
default_envs = xiao_rp2040

; 実機（当面 XIAO RP2040。RP2350 は board を seeed_xiao_rp2350 に変えた env を追加する）
[env:xiao_rp2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = seeed_xiao_rp2040
framework = arduino
board_build.core = earlephilhower
build_flags = -DUSE_TINYUSB
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
monitor_speed = 115200

; PC 上で lib/cw のロジックをテストする
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17

; 診断用：LED で各コアの生存を表示する（緑＝core0 ループ、青＝core1 ループ、赤＝setup 中）
[env:xiao_rp2040_debug]
extends = env:xiao_rp2040
build_flags = ${env:xiao_rp2040.build_flags} -DCW_HEARTBEAT
